name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar Capacitor
        run: npm install @capacitor/core@7.4.4 @capacitor/android@7.4.4 @capacitor/cli@7.4.4

      - name: Compilar aplicação web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configurar Capacitor
        run: npx cap init "Rede ATM & Bancos" "ao.redeatmbancos.app" --web-dir dist

      - name: Adicionar Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: rede-atm-bancos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
